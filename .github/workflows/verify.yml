name: Verify experiment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 2026-11-backend-ai-intro
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: "2026-11-backend-ai-intro/uv.lock"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest
      - run: uv run --locked backend-ai-intro component --output artifacts/component

  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: 2026-11-backend-ai-intro
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: "2026-11-backend-ai-intro/uv.lock"
      - run: uv sync --locked
      - run: uv run --locked python run.py
